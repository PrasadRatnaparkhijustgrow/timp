<c-row>
  <c-col xs="6">
    <c-card class="mb-4">
      <c-card-header ngPreserveWhitespaces>
        <strong>Profile</strong>
      </c-card-header>
      <c-card-body>
        <form cForm class="row g-3">
          <c-col md="12">
            <label cLabel for="venderName">Vendor Name</label>
            <input cFormControl id="venderName" type="text" />
          </c-col>
          <c-col md="12">
            <label cLabel for="companyName">Company Name</label>
            <input cFormControl id="companyName" type="text" />
          </c-col>
          <c-col md="6">
            <label cLabel for="email">Email</label>
            <input cFormControl id="email" type="email" />
          </c-col>
          <c-col md="6">
            <label cLabel for="inputEmail4">Phone</label>
            <input cFormControl id="phone" type="text" />
          </c-col>         
        </form>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col xs="6">
    <c-card class="mb-4">
      <c-card-header ngPreserveWhitespaces>
        <strong>Address</strong>
      </c-card-header>
      <c-card-body>
        <form cForm class="row g-3">
          <c-col xs="12">
            <label cLabel for="address">Address</label>
            <input cFormControl id="address" placeholder="1234 Main St" />
          </c-col>
          <c-col md="12">
            <label cLabel for="city">City</label>
            <input cFormControl id="city" />
          </c-col>
          <c-col md="5">
            <label cLabel for="state">State</label>
            <select cSelect id="state">
              <option>Choose...</option>
              <option>...</option>
            </select>
          </c-col>
          <c-col md="5">
            <label cLabel for="district">District</label>
            <select cSelect id="district">
              <option>Choose...</option>
              <option>...</option>
            </select>
          </c-col>
          <c-col md="2">
            <label cLabel for="zip">Zip</label>
            <input cFormControl id="zip" />
          </c-col>
        </form>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col xs="6">
    <c-card class="mb-4">
      <c-card-header ngPreserveWhitespaces>
        <strong>Account</strong>
      </c-card-header>
      <c-card-body>
        <form cForm class="row g-3">
          <c-col md="12">
            <label cLabel for="gst">GST</label>
            <input cFormControl id="gst" type="text" />
          </c-col>
          <c-col md="12">
            <label cLabel for="pan">PAN</label>
            <input cFormControl id="pan" type="text" />
          </c-col>
          <c-col md="12">
            <label cLabel for="aadhar">Aadhar</label>
            <input cFormControl id="aadhar" type="text" />
          </c-col>         
        </form>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col xs="6">
    <c-card class="mb-4">
      <c-card-header ngPreserveWhitespaces>
        <strong>Bank Details</strong>
      </c-card-header>
      <c-card-body>
        <form cForm class="row g-3">
          <c-col md="12">
            <label cLabel for="accountHolder">Account Holder</label>
            <input cFormControl id="accountHolder" type="text" />
          </c-col>
          <c-col md="6">
            <label cLabel for="bankName">Bank Name</label>
            <input cFormControl id="bankName" type="text" />
          </c-col>
          <c-col md="6">
            <label cLabel for="branchName">Branch Name</label>
            <input cFormControl id="branchName" type="text" />
          </c-col>     
          <c-col md="6">
            <label cLabel for="ifsc">IFSC Code</label>
            <input cFormControl id="ifsc" type="text" />
          </c-col>
          <c-col md="6">
            <label cLabel for="acnumber">Account Number</label>
            <input cFormControl id="acnumber" type="text" />
          </c-col>         
        </form>
      </c-card-body>
    </c-card>
  </c-col>

  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-body>
        <button cButton type="submit">Save</button>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
